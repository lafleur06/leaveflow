services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: leaveflow-postgres
    environment:
      - 'POSTGRES_DB=leaveflow'
      - 'POSTGRES_USER=leaveflow'
      - 'POSTGRES_PASSWORD=leaveflow'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'

volumes:
  postgres-data:
