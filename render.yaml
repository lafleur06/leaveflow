# Render Blueprint for the public demo: https://render.com/docs/blueprint-spec
# The database is a free Neon project; its connection details are entered once in the Render
# dashboard (sync: false) and never committed. See "Live demo" in the README for the steps.

services:
  - type: web
    name: leaveflow-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    # deploy main only after CI (tests, lint, image build) has passed
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: PORT
        value: "8080"
      # e.g. jdbc:postgresql://ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # a random signing key generated by Render, so logins survive restarts
      - key: LEAVEFLOW_JWT_SECRET
        generateValue: true
      # Neon's free plan allows few connections; the demo needs very few
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "4"
      # Render terminates HTTPS in front of the app
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      # 512 MB free instance: a smaller heap share, a single-threaded collector and quick JIT
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1"
