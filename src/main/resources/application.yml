spring:
  application:
    name: leaveflow
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Stable JSON shape for paged responses: { "content": [...], "page": { ... } }
        serialization-mode: via-dto
        max-page-size: 100
  docker:
    compose:
      # Starts compose.yaml on `mvnw spring-boot:run` and wires the datasource automatically.
      lifecycle-management: start-only

  web:
    # Default language of validation messages; clients may ask for another via Accept-Language.
    locale: en
  mvc:
    contentnegotiation:
      # Reports can be downloaded with ?format=csv or ?format=xlsx as well as with an Accept header.
      favor-parameter: true
      media-types:
        csv: text/csv
        xlsx: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

server:
  error:
    include-message: always

leaveflow:
  security:
    # At least 32 characters. Empty = random key per start (development only).
    jwt-secret: ${LEAVEFLOW_JWT_SECRET:}
    token-ttl: 1h
    admin:
      # First HR account, created at startup only when no HR account exists.
      email: ${LEAVEFLOW_ADMIN_EMAIL:hr@leaveflow.local}
      # Empty = a random password is generated and printed once in the log.
      password: ${LEAVEFLOW_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    # Opens every operation ready to send, without clicking "Try it out" first.
    try-it-out-enabled: true
    display-request-duration: true
    # Keeps the token after a page reload, so you do not have to authorize again.
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
